<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Coffee Bar Point</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="Multiform.css">
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="login-page">

    <!-- LEFT SIDE -->

    <div class="login-image">

        <div class="image-overlay">

            <div class="brand">
                ☕ Coffee Bar Point
            </div>

            <div class="image-text">

                <h1>
                    Fresh Coffee.<br>
                    Happy Moments.
                </h1>

                <p>
                    Your favourite coffee and snacks,
                    just a few clicks away.
                </p>

            </div>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="login-section">

        <div class="login-box">

            <div class="mobile-logo">
                ☕ Coffee Bar Point
            </div>

            <h2>
                Welcome Back! 👋
            </h2>

            <p class="login-subtitle">
                Login to continue your coffee journey.
            </p>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Email or Mobile
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="loginEmail"
                            placeholder="Enter email or mobile"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="password-label">

                        <label>
                            Password
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()">

                            <i
                            id="eyeIcon"
                            class="fa-regular fa-eye">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <!-- DIVIDER -->

                <div class="divider">

                    <span>OR</span>

                </div>


                <!-- GOOGLE -->

                <button
                    type="button"
                    class="google-btn">

                    <i class="fa-brands fa-google"></i>

                    Continue with Google

                </button>


                <!-- SIGNUP -->

                <p class="signup-text">

                    Don't have an account?

                    <a href="#">
                        Create Account
                    </a>

                </p>

            </form>

        </div>

    </div>

</div>


<script>

function togglePassword(){

    const password =
        document.getElementById(
            "loginPassword"
        );

    const icon =
        document.getElementById(
            "eyeIcon"
        );


    if(password.type === "password"){

        password.type = "text";

        icon.classList.remove(
            "fa-eye"
        );

        icon.classList.add(
            "fa-eye-slash"
        );

    }else{

        password.type = "password";

        icon.classList.remove(
            "fa-eye-slash"
        );

        icon.classList.add(
            "fa-eye"
        );

    }

}


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        const email =
            document
            .getElementById("loginEmail")
            .value.trim();

        const password =
            document
            .getElementById("loginPassword")
            .value.trim();


        if(!email || !password){

            alert(
                "Please enter your login details."
            );

            return;

        }


        /*
         * Temporary login
         *
         * Later we will connect this
         * with Firebase / backend.
         */

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
